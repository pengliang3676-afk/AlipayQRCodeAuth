name: AlipayQRCodeAuth
options:
  bundleIdPrefix: com.alipayqr
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  compatibilityVersion: "Xcode 14.0"

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "200"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_STYLE: Manual
    ONLY_ACTIVE_ARCH: NO
    ENABLE_BITCODE: NO

targets:
  AlipayQRCodeAuth:
    type: application
    platform: iOS
    sources:
      - path: AlipayQRCodeAuth
      - path: Vendor/AlipaySDK.bundle
    dependencies:
      - framework: Vendor/AlipaySDK.framework
        embed: false
        codeSign: false
      - sdk: SystemConfiguration.framework
      - sdk: CoreTelephony.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libsqlite3.tbd
    info:
      path: AlipayQRCodeAuth/Info.plist
      properties:
        CFBundleDisplayName: 支付宝授权
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "200"
        CFBundlePackageType: APPL
        CFBundleSignature: "????"
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "13.0"
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIBackgroundModes:
          - fetch
        # 接管支付宝 URL Scheme（侦查用）
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.alipay.client
            CFBundleURLSchemes:
              - alipay
              - alipays
              - alipayqr
        LSApplicationQueriesSchemes:
          - alipay
          - alipays
          - alipayqr
          - baiduboxapp
          - baiduboxlite
          - baidunetdisk
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alipayqr.qrauth
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/Vendor
        OTHER_LDFLAGS: "-ObjC"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
